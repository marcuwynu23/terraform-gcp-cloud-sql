name: CD - Terraform Apply

on:
  workflow_dispatch:
    inputs:
      project_id:
        description: GCP project ID
        required: true
        type: string
      region:
        description: "GCP region (Free Tier: us-west1, us-central1, us-east1)"
        required: true
        type: string
        default: us-central1
      instance_name:
        description: Name of the Cloud SQL instance
        required: true
        type: string
      database_name:
        description: Name of the initial database
        required: true
        type: string
      database_user:
        description: Name of the initial database user
        required: true
        type: string
      database_version:
        description: Database engine version (MYSQL_8_0, POSTGRES_14, POSTGRES_15)
        required: true
        type: string
        default: MYSQL_8_0
      tier:
        description: "Machine type (Free Tier: db-f1-micro)"
        required: true
        type: string
        default: db-f1-micro

env:
  TF_BUCKET_NAME: ${{ secrets.TF_BUCKET_NAME }}
  TF_BUCKET_PREFIX: ${{ secrets.TF_BUCKET_PREFIX }}

jobs:
  apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Authenticate to GCP
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: latest
    - name: Ensure GCS State Bucket Exists
      run: |
        gcloud storage buckets describe gs://$TF_BUCKET_NAME --format="json" 2>/dev/null || \
        gcloud storage buckets create gs://$TF_BUCKET_NAME \
          --location=${{ github.event.inputs.region }} \
          --uniform-bucket-level-access
    - name: Terraform Init
      run: |
        terraform init \
          -backend-config="bucket=$TF_BUCKET_NAME" \
          -backend-config="prefix=$TF_BUCKET_PREFIX"
    - name: Terraform Plan
      run: |
        terraform plan \
          -var="project_id=${{ github.event.inputs.project_id }}" \
          -var="region=${{ github.event.inputs.region }}" \
          -var="instance_name=${{ github.event.inputs.instance_name }}" \
          -var="database_name=${{ github.event.inputs.database_name }}" \
          -var="database_user=${{ github.event.inputs.database_user }}" \
          -var="database_version=${{ github.event.inputs.database_version }}" \
          -var="tier=${{ github.event.inputs.tier }}"
    - name: Terraform Apply
      run: |
        terraform apply -auto-approve \
          -var="project_id=${{ github.event.inputs.project_id }}" \
          -var="region=${{ github.event.inputs.region }}" \
          -var="instance_name=${{ github.event.inputs.instance_name }}" \
          -var="database_name=${{ github.event.inputs.database_name }}" \
          -var="database_user=${{ github.event.inputs.database_user }}" \
          -var="database_version=${{ github.event.inputs.database_version }}" \
          -var="tier=${{ github.event.inputs.tier }}"
