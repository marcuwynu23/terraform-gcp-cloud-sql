name: CD - GCP Cloud SQL (Apply / Destroy)

on:
  workflow_dispatch:
    inputs:
      command:
        description: Terraform operation
        required: true
        type: choice
        options:
          - apply
          - destroy
        default: apply
      project_id:
        description: GCP project ID
        required: true
        type: string
      region:
        description: "GCP region (Free Tier: us-west1, us-central1, us-east1)"
        required: true
        type: string
        default: us-central1
      instance_name:
        description: Name of the Cloud SQL instance
        required: true
        type: string
      database_name:
        description: Name of the initial database
        required: true
        type: string
      database_user:
        description: Name of the initial database user
        required: true
        type: string
      database_version:
        description: Database engine version (MYSQL_8_0, POSTGRES_14, POSTGRES_15)
        required: true
        type: string
        default: MYSQL_8_0
      tier:
        description: "Machine type (Free Tier: db-f1-micro)"
        required: true
        type: string
        default: db-f1-micro

env: {}

jobs:
  provision:
    name: Terraform ${{ github.event.inputs.command }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: latest
      - name: Terraform Init
        run: terraform init
      - name: Terraform Plan
        run: |
          terraform plan ${{ github.event.inputs.command == 'destroy' && '-destroy' || '' }} \
            -var="project_id=${{ github.event.inputs.project_id }}" \
            -var="region=${{ github.event.inputs.region }}" \
            -var="instance_name=${{ github.event.inputs.instance_name }}" \
            -var="database_name=${{ github.event.inputs.database_name }}" \
            -var="database_user=${{ github.event.inputs.database_user }}" \
            -var="database_version=${{ github.event.inputs.database_version }}" \
            -var="tier=${{ github.event.inputs.tier }}"
      - name: Terraform Apply / Destroy
        run: |
          terraform ${{ github.event.inputs.command }} -auto-approve \
            -var="project_id=${{ github.event.inputs.project_id }}" \
            -var="region=${{ github.event.inputs.region }}" \
            -var="instance_name=${{ github.event.inputs.instance_name }}" \
            -var="database_name=${{ github.event.inputs.database_name }}" \
            -var="database_user=${{ github.event.inputs.database_user }}" \
            -var="database_version=${{ github.event.inputs.database_version }}" \
            -var="tier=${{ github.event.inputs.tier }}"
